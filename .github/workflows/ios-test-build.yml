name: Build Test IPA

on:
  push:
    branches:
      - main-build-testing
    paths:
      - '.github/workflows/ios-test-build.yml'
      - 'composeApp/**'
      - 'iosApp/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      configuration:
        description: Production-optimized or fast validation build
        required: true
        type: choice
        options:
          - Debug
          - Release
        default: Release
      disable_phases:
        description: "iOS Release: Kotlin/Native phases to skip."
        required: false
        type: choice
        default: skip-both
        options:
          - full
          - skip-static-init
          - skip-devirtualization
          - skip-both

permissions:
  contents: read

concurrency:
  group: ios-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned full ${{ inputs.configuration || 'Release' }} IPA
    runs-on: xcode-27
    timeout-minutes: ${{ (inputs.configuration || 'Release') == 'Release' && 180 || 30 }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
      NUVIO_IOS_PHASE_PROFILE: ${{ inputs.disable_phases || 'skip-both' }}
      KOTLIN_DAEMON_JVMARGS: -Xmx1024M
      NUVIO_GRADLE_JVMARGS: -Xmx2048M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M -XX:+UseG1GC
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx9216M -XX:+UseG1GC
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      CONTRIBUTIONS_URL: https://api.github.com/repos/luqmanfadlli/NuvioMobile-Enhanced/contributors?per_page=100

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # main-build-testing is not the repository default branch; allow its own
          # successful builds to maintain a reusable branch-scoped Gradle cache.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Cache Gradle configuration cache
        uses: actions/cache@v6
        with:
          path: .gradle/configuration-cache
          key: ${{ runner.os }}-${{ runner.arch }}-ios-config-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'buildSrc/**', 'build-logic/**') }}
      - name: Verify Java and Gradle toolchains
        shell: bash
        run: |
          set -euo pipefail
          java_properties="$(java -XshowSettings:properties -version 2>&1)"
          printf '%s\\n' "$java_properties"
          grep -Fq 'java.specification.version = 17' <<< "$java_properties"
          grep -Fq 'java.vendor = Eclipse Adoptium' <<< "$java_properties"

          gradle_output="$(./gradlew --version)"
          printf '%s\\n' "$gradle_output"
          grep -Eq '^Gradle 9\\.9\\.2
      - name: Cache Kotlin Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure runtime properties
        run: |
          set -euo pipefail

          # Keep non-backend service configuration from the repository secret, but
          # always compile the official server against its current discovery values.
          if [[ -n "${RELEASE_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
          else
            : > local.properties
          fi

          # Remove stale machine, signing, backend, and contributor values first.
          sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE|NUVIO_SUPABASE_URL|NUVIO_SUPABASE_ANON_KEY|NUVIO_SUPABASE_FALLBACK_URL|CONTRIBUTIONS_URL)[[:space:]]*=/d' local.properties

          discovery_json="$(curl --fail --silent --show-error --location \
            --retry 3 --connect-timeout 10 --max-time 30 \
            https://api.nuvio.tv/.well-known/nuvio)"

          nuvio_backend_url="$(printf '%s' "$discovery_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["backend_url"])')"
          nuvio_publishable_key="$(printf '%s' "$discovery_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["publishable_key"])')"

          test -n "$nuvio_backend_url"
          test -n "$nuvio_publishable_key"

          {
            printf 'NUVIO_SUPABASE_URL=%s\n' "$nuvio_backend_url"
            printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "$nuvio_publishable_key"
            printf 'NUVIO_SUPABASE_FALLBACK_URL=\n'
            if [[ -n "${CONTRIBUTIONS_URL}" ]]; then
              printf 'CONTRIBUTIONS_URL=%s\n' "${CONTRIBUTIONS_URL}"
            fi
          } >> local.properties

          test -s local.properties
          grep -Eq '^NUVIO_SUPABASE_URL=.+$' local.properties
          grep -Eq '^NUVIO_SUPABASE_ANON_KEY=.+$' local.properties

      - name: Constrain Gradle memory for the hosted runner
        run: |
          gradle_user_home="${GRADLE_USER_HOME:-${HOME}/.gradle}"
          mkdir -p "${gradle_user_home}"
          {
            echo "org.gradle.jvmargs=${NUVIO_GRADLE_JVMARGS}"
            echo "kotlin.daemon.jvmargs=${KOTLIN_DAEMON_JVMARGS}"
            echo "kotlin.native.jvmArgs=${NUVIO_KOTLIN_NATIVE_JVMARGS}"
            echo "org.gradle.parallel=false"
            echo "org.gradle.workers.max=1"
            echo "kotlin.native.disableCompilerDaemon=true"
            case "${NUVIO_IOS_PHASE_PROFILE:-skip-both}" in
              full) NUVIO_IOS_DISABLE_PHASES="" ;;
              skip-static-init) NUVIO_IOS_DISABLE_PHASES="RemoveRedundantCallsToStaticInitializersPhase" ;;
              skip-devirtualization) NUVIO_IOS_DISABLE_PHASES="DevirtualizationAnalysis,Devirtualization" ;;
              *) NUVIO_IOS_DISABLE_PHASES="DevirtualizationAnalysis,Devirtualization,RemoveRedundantCallsToStaticInitializersPhase" ;;
            esac
            if [ -n "${NUVIO_IOS_DISABLE_PHASES}" ]; then
              echo "nuvio.ios.releaseDisablePhases=${NUVIO_IOS_DISABLE_PHASES}"
            fi
          } >> "${gradle_user_home}/gradle.properties"
          cat "${gradle_user_home}/gradle.properties"

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Run iOS simulator regression tests
        run: |
          ./gradlew :composeApp:iosSimulatorArm64Test \
            -Dorg.gradle.jvmargs="${NUVIO_GRADLE_JVMARGS}" \
            -Pkotlin.daemon.jvmargs="${KOTLIN_DAEMON_JVMARGS}" \
            -Pkotlin.native.jvmArgs="${NUVIO_KOTLIN_NATIVE_JVMARGS}" \
            --max-workers=1 --stacktrace
      - name: Build unsigned full ${{ inputs.configuration || 'Release' }} IPA
        run: |
          (
            while sleep 60; do
              echo "::group::Build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime
              vm_stat
              ps -Ao pid,etime,%cpu,rss,command -r | head -n 12 || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT
          ./scripts/build-ios-ipa.sh

      - name: Summarize IPA
        run: |
          configuration_slug="$(printf '%s' "${IOS_CONFIGURATION}" | tr '[:upper:]' '[:lower:]')"
          ipa_path="$(find build/ios-ipa -maxdepth 1 -type f -name "*-${configuration_slug}.ipa" -print -quit)"
          if [[ -z "${ipa_path}" ]]; then
            echo "No IPA was produced." >&2
            exit 1
          fi

          {
            echo "## Test IPA"
            echo
            echo "- File: $(basename "${ipa_path}")"
            echo "- Size: $(du -h "${ipa_path}" | cut -f1)"
            echo "- SHA-256: $(shasum -a 256 "${ipa_path}" | awk '{print $1}')"
            echo "- Distribution: full"
            echo "- Configuration: ${IOS_CONFIGURATION}"
            echo "- Signing: unsigned"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test IPA
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-test-${{ inputs.configuration }}-ipa-${{ github.sha }}
          path: build/ios-ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
 <<< "$gradle_output"
          grep -Eq '^(Launcher JVM|JVM): 17([.]|[[:space:]])' <<< "$gradle_output"

      - name: Cache Kotlin Native
