name: PR Full Debug Build

on:
  push:
    branches: [ci/liquid-glass-targeted-tests-20261024]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [enhanced]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-full-debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Constrain Gradle memory for the hosted Linux runner
        run: |
          gradle_user_home="${GRADLE_USER_HOME:-${HOME}/.gradle}"
          mkdir -p "${gradle_user_home}"
          {
            echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g -XX:+UseG1GC"
            echo "kotlin.daemon.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC"
            echo "org.gradle.parallel=false"
            echo "org.gradle.workers.max=2"
          } >> "${gradle_user_home}/gradle.properties"

      - name: Prepare runtime properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          # Keep build configuration, but never use stale SDK, signing-file, or backend URLs.
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE|NUVIO_SUPABASE_URL|NUVIO_SUPABASE_ANON_KEY|NUVIO_SUPABASE_FALLBACK_URL)[[:space:]]*=/d' local.properties

          # Match Codemagic's public backend discovery for email-link sign-in and backend features.
          discovery_json="$(curl --fail --silent --show-error --location \
            --retry 3 --connect-timeout 10 --max-time 30 \
            https://api.nuvio.tv/.well-known/nuvio)"

          nuvio_backend_url="$(printf '%s' "$discovery_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["backend_url"])')"
          nuvio_publishable_key="$(printf '%s' "$discovery_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["publishable_key"])')"

          test -n "$nuvio_backend_url"
          test -n "$nuvio_publishable_key"

          cat >> local.properties <<EOF
          NUVIO_SUPABASE_URL=$nuvio_backend_url
          NUVIO_SUPABASE_ANON_KEY=$nuvio_publishable_key
          NUVIO_SUPABASE_FALLBACK_URL=
          EOF

      - name: Run focused Android host regression tests
        run: |
          ./gradlew :composeApp:testAndroidHostTest \
            --tests com.nuvio.app.core.ui.FloatingNavigationBarGestureTest \
            --tests com.nuvio.app.features.downloads.AndroidDownloadTransferTest \
            --tests com.nuvio.app.features.player.NextEpisodeCardTest \
            --tests com.nuvio.app.features.player.PlayerGestureOverlayTest \
            --tests com.nuvio.app.features.player.PlayerSurfaceGesturesTest \
            --tests com.nuvio.app.features.profiles.ProfileAvatarBorderColorTest \
            --tests com.nuvio.app.features.settings.NavigationBarGlassSettingsTest \
            --tests com.nuvio.app.features.settings.ThemeSettingsRepositoryTest \
            --tests com.nuvio.app.core.ui.glass.LiquidGlassEffectSettingsTest \
            --tests com.nuvio.app.core.storage.LocalAccountDataCleanerTest \
            --tests com.nuvio.app.navigation.NavigationSavedStateConfigurationTest \
            -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Summarize Android host test failures
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          files = glob.glob("composeApp/build/test-results/testAndroidHostTest/*.xml")
          failures = []
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except (ET.ParseError, OSError):
                  continue
              for case in root.iter("testcase"):
                  for node in list(case.findall("failure")) + list(case.findall("error")):
                      name = f"{case.attrib.get('classname', '')}#{case.attrib.get('name', '')}"
                      message = node.attrib.get("message", "")
                      detail = (node.text or "").strip()
                      failures.append((name, message, detail))
          print(f"Parsed {len(files)} test result XML files; {len(failures)} failing cases.")
          for name, message, detail in failures:
              print(f"FAIL: {name}: {message}")
              if detail:
                  print(detail[:4000])
          PY

      - name: Build fullDebug APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v7
        with:
          path: androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
