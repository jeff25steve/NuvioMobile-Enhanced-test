name: PR Full Debug Build

on:
  push:
    branches:
      - "ci/verify-pr-liquid-glass-editor-linux-20261031"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [enhanced]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-full-debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare runtime properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi

      - name: Set up Java 21 for Robolectric SDK 36 tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Run shared and Android host tests
        run: ./gradlew :composeApp:testAndroidHostTest --stacktrace

      - name: Summarize host-test failures
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report_dir = Path("composeApp/build/test-results/testAndroidHostTest")
          reports = sorted(report_dir.glob("TEST-*.xml"))
          if not reports:
              print(f"No JUnit XML reports found under {report_dir}")
              raise SystemExit(0)

          total = failed = errors = skipped = 0
          for report in reports:
              root = ET.parse(report).getroot()
              total += int(root.attrib.get("tests", 0))
              failed += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))
              for case in root.iter("testcase"):
                  problem = next((child for child in case if child.tag in ("failure", "error")), None)
                  if problem is None:
                      continue
                  name = f"{case.attrib.get('classname', report.stem)}.{case.attrib.get('name', '<unknown>')}"
                  print(f"\n===== {problem.tag.upper()}: {name} =====")
                  print(problem.attrib.get("message", "(no message)"))
                  detail = (problem.text or "").strip()
                  if detail:
                      print(detail[:6000])
          print(f"\nHOST TEST TOTALS: {total} tests, {failed} failures, {errors} errors, {skipped} skipped")
          PY

      - name: Upload host-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-host-test-reports-${{ github.sha }}
          path: |
            composeApp/build/test-results/testAndroidHostTest/
            composeApp/build/reports/tests/testAndroidHostTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Restore Java 17 for Android APK build
        if: always()
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Rust
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Build fullDebug APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v7
        with:
          path: androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
