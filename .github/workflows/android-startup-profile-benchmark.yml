name: Android Startup Profile Benchmark Builds

on:
  push:
    branches:
      - main-build-testing
    paths:
      - ".github/workflows/android-startup-profile-benchmark.yml"
      - "androidApp/**"
      - "baselineProfile/**"
      - "composeApp/**"
      - "native/**"
      - "gradle/**"
      - "scripts/run-android-startup-profile-benchmark.sh"
      - "build.gradle.kts"
      - "settings.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-startup-profile-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed release and R8 benchmark variants
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
      CONTRIBUTIONS_URL: https://api.github.com/repos/luqmanfadlli/NuvioMobile-Enhanced/contributors?per_page=100

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure signed release properties
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${LOCAL_PROPERTIES_BASE64}" ]] || {
            echo "Missing NUVIO_LOCAL_PROPERTIES_BASE64 repository secret." >&2
            exit 1
          }
          [[ -n "${RELEASE_KEYSTORE_BASE64}" ]] || {
            echo "Missing NUVIO_RELEASE_KEYSTORE_BASE64 repository secret." >&2
            exit 1
          }

          keystore_path="${RUNNER_TEMP}/nuvio-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties

          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          printf '\nNUVIO_RELEASE_STORE_FILE=%s\n' "${keystore_path}" >> local.properties
          printf 'CONTRIBUTIONS_URL=%s\n' "${CONTRIBUTIONS_URL}" >> local.properties

          required_properties=(
            NUVIO_RELEASE_STORE_PASSWORD
            NUVIO_RELEASE_KEY_ALIAS
            NUVIO_RELEASE_KEY_PASSWORD
            TRAKT_CLIENT_ID
            TRAKT_CLIENT_SECRET
            SIMKL_CLIENT_ID
          )
          for property_name in "${required_properties[@]}"; do
            if ! grep -Eq "^[[:space:]]*${property_name}[[:space:]]*=.+" local.properties; then
              echo "Missing required release property: ${property_name}" >&2
              exit 1
            fi
          done

      - name: Set up Rust Android targets
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      - name: Build full production release APKs
        run: ./gradlew :androidApp:assembleFullRelease -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Build Play Store production release APKs
        run: ./gradlew :androidApp:assemblePlaystoreRelease -Pnuvio.android.distribution=playstore -Pnuvio.ios.distribution=appstore --stacktrace

      # Keep benchmark tasks separate from assemble*Release tasks. Nuvio's
      # build script intentionally enables ABI splits only for release task names.
      - name: Build full R8 benchmark app and instrumentation APKs
        run: |
          ./gradlew \
            :androidApp:assembleFullBenchmark \
            :baselineProfile:assembleFullBenchmark \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=appstore \
            --stacktrace

      - name: Build Play Store R8 benchmark app and instrumentation APKs
        run: |
          ./gradlew \
            :androidApp:assemblePlaystoreBenchmark \
            :baselineProfile:assemblePlaystoreBenchmark \
            -Pnuvio.android.distribution=playstore \
            -Pnuvio.ios.distribution=appstore \
            --stacktrace

      - name: Assemble phone-ready bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phone-benchmark

          for flavor in full playstore; do
            mkdir -p "phone-benchmark/$flavor/release"

            while IFS= read -r apk; do
              [[ -n "$apk" ]] || continue
              cp "$apk" "phone-benchmark/$flavor/release/"
            done < <(find androidApp/build/outputs/apk -type f -name '*.apk' -path "*/$flavor/release/*" -print | sort)

            app_apk="$(find androidApp/build/outputs/apk -type f -name '*.apk' -path "*/$flavor/benchmark/*" -print | head -n 1)"
            test_apk="$(find baselineProfile/build/outputs/apk -type f -name '*.apk' -path "*/$flavor/benchmark/*" -print | head -n 1)"

            [[ -n "$app_apk" ]] || {
              echo "Missing optimized $flavor benchmark app APK." >&2
              find androidApp/build/outputs/apk -type f -name '*.apk' -print >&2
              exit 1
            }
            [[ -n "$test_apk" ]] || {
              echo "Missing $flavor Macrobenchmark instrumentation APK." >&2
              find baselineProfile/build/outputs/apk -type f -name '*.apk' -print >&2
              exit 1
            }

            cp "$app_apk" "phone-benchmark/$flavor/Nuvio-$flavor-Benchmark.apk"
            cp "$test_apk" "phone-benchmark/$flavor/Nuvio-$flavor-Benchmark-Tests.apk"
          done

          cp scripts/run-android-startup-profile-benchmark.sh phone-benchmark/
          cat > phone-benchmark/START-HERE.txt <<'EOF'
          NUVIO ANDROID STARTUP PROFILE / BENCHMARK BUNDLE

          This bundle contains both production release flavors and the corresponding
          AndroidX benchmarkRelease app/test APKs. The benchmarkRelease variants are
          generated by the Baseline Profile Gradle plugin from Nuvio's release build
          configuration (R8/minification enabled, non-debuggable, profileable) and
          inherit the release signing configuration.

          FLAVORS
          - full: sideload distribution
          - playstore: Play Store distribution
          Both use the same production application ID, com.nuvio.media.

          IMPORTANT
          1. Do not use a debug APK for these measurements.
          2. Use one physical Android device for both flavors and both compilation modes.
          3. Sign in and complete onboarding once before running the profile/benchmark script.
          4. Do not clear app data or uninstall between flavors. The shared package ID and
             same release signing key allow the signed-in test state to survive upgrades.
          5. The generator explicitly waits for nuvio_startup_ready. It fails rather than
             accepting a splash, login, or onboarding screen as the signed-in Home journey.
          6. CI builds APKs only. It does not fabricate a signed-in account or claim
             physical-device TTID/TTFD results.

          TO GENERATE BOTH PROFILES AND RUN THE DEVICE A/B TEST
          - Check out this exact repository revision on a machine with Android SDK,
            Gradle wrapper support, the release keystore in local.properties, and ADB.
          - Connect exactly one physical Android 13+ device (API 33+) over USB or
            Wireless debugging. Rooted API 28+ devices are also supported.
          - Open Nuvio and make sure the normal signed-in Home screen is visible.
          - Run: ./scripts/run-android-startup-profile-benchmark.sh

          The script generates fullRelease and playstoreRelease profiles from the
          non-minified release variants, then runs 10 cold starts for each of:
          CompilationMode.None() and CompilationMode.Partial(BaselineProfileMode.Require)
          on each matching R8 benchmarkRelease flavor.

          Review the generated source profiles and the binary assets/dexopt/baseline.prof
          sizes before accepting anything. The binary profile must be below 1.5 MB.
          Keep the generated profiles only if neither TTID nor TTFD regresses and the
          improvement is repeatable. Do not commit profiles solely because generation passed.
          EOF

          find phone-benchmark -type f -name '*.apk' -print0 | sort -z | xargs -0 sha256sum > phone-benchmark/SHA256SUMS.txt
          find phone-benchmark -maxdepth 4 -type f -printf '%p (%s bytes)\n' | sort

      - name: Upload signed Android build bundle
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-android-startup-profile-${{ github.sha }}
          path: phone-benchmark/
          if-no-files-found: error
          retention-days: 14
