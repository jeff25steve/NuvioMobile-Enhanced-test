name: Android Startup Profile Benchmark Builds

on:
  push:
    branches:
      - main-build-testing
    paths:
      - ".github/workflows/android-startup-profile-benchmark.yml"
      - "androidApp/**"
      - "baselineProfile/**"
      - "composeApp/**"
      - "native/**"
      - "gradle/**"
      - "scripts/run-android-startup-profile-benchmark.sh"
      - "build.gradle.kts"
      - "settings.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-startup-profile-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build R8 benchmark APKs for both release flavors
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      CONTRIBUTIONS_URL: https://api.github.com/repos/luqmanfadlli/NuvioMobile-Enhanced/contributors?per_page=100

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare runtime properties
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${LOCAL_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE|NUVIO_SUPABASE_URL|NUVIO_SUPABASE_ANON_KEY|NUVIO_SUPABASE_FALLBACK_URL)[[:space:]]*=/d' local.properties

          discovery_json="$(curl --fail --silent --show-error --location \
            --retry 3 --connect-timeout 10 --max-time 30 \
            https://api.nuvio.tv/.well-known/nuvio)"
          nuvio_backend_url="$(printf '%s' "$discovery_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["backend_url"])')"
          nuvio_publishable_key="$(printf '%s' "$discovery_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["publishable_key"])')"
          test -n "$nuvio_backend_url"
          test -n "$nuvio_publishable_key"

          cat >> local.properties <<EOF
          NUVIO_SUPABASE_URL=$nuvio_backend_url
          NUVIO_SUPABASE_ANON_KEY=$nuvio_publishable_key
          NUVIO_SUPABASE_FALLBACK_URL=
          EOF
          printf 'CONTRIBUTIONS_URL=%s\n' "${CONTRIBUTIONS_URL}" >> local.properties

      - name: Validate physical-device runner script
        run: bash -n scripts/run-android-startup-profile-benchmark.sh

      - name: Set up Rust Android targets
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked

      # AndroidX creates benchmarkRelease from release: R8 and resource shrinking
      # remain enabled; the variant is non-debuggable/profileable and uses a local
      # debug key so the fork does not need the production keystore secrets.
      - name: Build full R8 benchmark app and instrumentation APKs
        run: |
          ./gradlew \
            :androidApp:assembleFullBenchmarkRelease \
            :baselineProfile:assembleFullBenchmarkRelease \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=appstore \
            --stacktrace

      - name: Build Play Store R8 benchmark app and instrumentation APKs
        run: |
          ./gradlew \
            :androidApp:assemblePlaystoreBenchmarkRelease \
            :baselineProfile:assemblePlaystoreBenchmarkRelease \
            -Pnuvio.android.distribution=playstore \
            -Pnuvio.ios.distribution=appstore \
            --stacktrace

      - name: Assemble phone-ready benchmark bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phone-benchmark

          for flavor in full playstore; do
            app_apk="$(find androidApp/build/outputs/apk -type f -name '*.apk' -path "*/$flavor/benchmarkRelease/*" -print | head -n 1)"
            test_apk="$(find baselineProfile/build/outputs/apk -type f -name '*.apk' -path "*/$flavor/benchmarkRelease/*" -print | head -n 1)"

            [[ -n "$app_apk" ]] || {
              echo "Missing optimized $flavor benchmarkRelease app APK." >&2
              find androidApp/build/outputs/apk -type f -name '*.apk' -print >&2
              exit 1
            }
            [[ -n "$test_apk" ]] || {
              echo "Missing $flavor Macrobenchmark instrumentation APK." >&2
              find baselineProfile/build/outputs/apk -type f -name '*.apk' -print >&2
              exit 1
            }

            cp "$app_apk" "phone-benchmark/Nuvio-$flavor-BenchmarkRelease.apk"
            cp "$test_apk" "phone-benchmark/Nuvio-$flavor-BenchmarkRelease-Tests.apk"
          done

          cp scripts/run-android-startup-profile-benchmark.sh phone-benchmark/
          cat > phone-benchmark/START-HERE.txt <<'EOF'
          NUVIO ANDROID STARTUP PROFILE / BENCHMARK BUNDLE

          This bundle contains the optimized AndroidX benchmarkRelease app/test APK
          pairs for both Nuvio distribution flavors:
          - full
          - playstore

          These are release-mirrored profiling APKs, not debug-build-type APKs:
          - R8/minification enabled
          - resource shrinking enabled
          - non-debuggable
          - profileable for Macrobenchmark
          - signed with the GitHub runner's local Android debug key
          Production release signing keys are not included in this repository.

          INSTALL / SIGN-IN
          1. Use one physical Android device for both flavors and both A/B arms.
          2. Do not install these CI APKs for the local device run: CI's temporary Android
             debug key differs from the debug key on your machine. The local runner builds
             and installs its own benchmarkRelease APKs using one consistent local key.
          3. If production-signed Nuvio is installed, the local install will be rejected.
             Uninstall the production copy once, then rerun the script; this clears its
             local data, so you must sign in again on the benchmark build.
          4. The script installs the local full benchmarkRelease APK and pauses while you
             sign in on the phone. Keep that app installed for the full/playstore runs.
          5. Do not clear app data or uninstall between flavors; both share
             com.nuvio.media and the same local benchmark signing key.
          6. Keep the device cool, plugged in, and on the same network for all runs.

          PROFILE GENERATION / A-B
          Run on a machine with this repository revision, Android SDK, Gradle, ADB, and
          the same physical device connected. Android 13+ (API 33+) is supported without
          root; API 28+ is supported on a rooted device.

          Run:
            bash scripts/run-android-startup-profile-benchmark.sh

          The script builds and installs the local R8 benchmark variant, pauses for sign-in,
          generates profiles for both flavors, and runs the two A/B arms for each flavor.

          The script generates separate fullRelease and playstoreRelease Baseline and
          Startup Profiles from the nonMinifiedRelease variants. It then compares 10
          cold starts with CompilationMode.None() against 10 with
          CompilationMode.Partial(BaselineProfileMode.Require) for each flavor using
          the same device and signed-in install.

          Both collection and measurement wait for Nuvio's nuvio_startup_ready marker.
          Login/onboarding does not count as Home-ready and makes the run fail.

          Review TTID and TTFD medians for both flavors and verify the packaged binary
          assets/dexopt/baseline.prof is below 1.5 MB. Keep generated profiles only if
          both TTID and TTFD improve repeatably, with no regressions. Do not commit
          profiles merely because collection/build succeeds.
          EOF

          find phone-benchmark -type f -name '*.apk' -print0 | sort -z | xargs -0 sha256sum > phone-benchmark/SHA256SUMS.txt
          find phone-benchmark -maxdepth 2 -type f -printf '%p (%s bytes)\n' | sort

      - name: Upload R8 benchmark APK bundle
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-android-startup-profile-${{ github.sha }}
          path: phone-benchmark/
          if-no-files-found: error
          retention-days: 14
