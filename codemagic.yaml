workflows:
  android-full-debug:
    name: Nuvio Enhanced - Android Full Debug
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      java: 17
      vars:
        CM_RECURSIVE_SUBMODULE_INIT: "false"

    scripts:
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Verify Compose resource accessors
        script: |
          set -e
          ./gradlew :composeApp:generateResourceAccessorsForCommonMain \
            --rerun-tasks \
            --no-daemon \
            --stacktrace \
            --console=plain
          generated_dir="$CM_BUILD_DIR/composeApp/build/generated/compose/resourceGenerator/kotlin/commonMainResourceAccessors"
          test -d "$generated_dir"
          if ! grep -R -q "whats_new_since_unavailable" "$generated_dir"; then
            echo "ERROR: Generated Compose resource accessors do not contain What’s New resources."
            find "$generated_dir" -type f -print || true
            exit 1
          fi

      - name: Build Android Full Debug APK
        script: |
          set -o pipefail
          ./gradlew :androidApp:assembleFullDebug             -Pnuvio.android.distribution=full             -Pnuvio.ios.distribution=appstore             --no-daemon             --stacktrace             --console=plain 2>&1 | tee "$CM_BUILD_DIR/gradle-build.log"
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            echo ""
            echo "===== Kotlin/Gradle compiler diagnostics ====="
            grep -E '(^|[^[:alnum:]])(e: |error: |w: |FAILURE:|Caused by:)'               "$CM_BUILD_DIR/gradle-build.log" | tail -n 200 || true
          fi
          exit "$build_status"

    artifacts:
      - androidApp/build/outputs/**/*.apk
      - gradle-build.log
