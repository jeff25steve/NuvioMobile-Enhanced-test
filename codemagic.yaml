workflows:
  android-full-debug:
    name: Nuvio Enhanced - Android Full Debug
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      java: 17
      vars:
        CM_RECURSIVE_SUBMODULE_INIT: "false"
        NUVIO_BUILD_CHANNEL: "beta"

    scripts:
      - name: Configure Android build
        script: |
          set -euo pipefail

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

          discovery_json="$(curl --fail --silent --show-error --location \
            --retry 3 --connect-timeout 10 --max-time 30 \
            https://api.nuvio.tv/.well-known/nuvio)"

          nuvio_backend_url="$(printf '%s' "$discovery_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["backend_url"])')"
          nuvio_publishable_key="$(printf '%s' "$discovery_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["publishable_key"])')"
          nuvio_tv_login="$(printf '%s' "$discovery_json" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["capabilities"]["tv_login"]).lower())')"

          test -n "$nuvio_backend_url"
          test -n "$nuvio_publishable_key"
          test "$nuvio_tv_login" = "true"

          cat >> "$CM_BUILD_DIR/local.properties" <<EOF
          NUVIO_SUPABASE_URL=$nuvio_backend_url
          NUVIO_SUPABASE_ANON_KEY=$nuvio_publishable_key
          NUVIO_SUPABASE_FALLBACK_URL=
          EOF

      - name: Build Android Full Debug APK
        script: |
          set -o pipefail
          beta_version_name="$(grep '^MARKETING_VERSION=' iosApp/Configuration/Version.xcconfig | cut -d= -f2)-beta"
          ./gradlew :androidApp:assembleFullDebug \
            -Pnuvio.app.versionName="$beta_version_name" \
            -Pnuvio.android.distribution=full \
            -Pnuvio.ios.distribution=appstore \
            --no-daemon \
            --stacktrace \
            --console=plain 2>&1 | tee "$CM_BUILD_DIR/gradle-build.log"
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            echo ""
            echo "===== Kotlin/Gradle compiler diagnostics ====="
            grep -E '(^|[^[:alnum:]])(e: |error: |w: |FAILURE:|Caused by:)' \
              "$CM_BUILD_DIR/gradle-build.log" | tail -n 200 || true
          fi
          exit "$build_status"

    artifacts:
      - androidApp/build/outputs/**/*.apk
      - gradle-build.log
