workflows:
  android-full-debug:
    name: Nuvio Enhanced - Android Full Debug
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      java: 17
      vars:
        CM_RECURSIVE_SUBMODULE_INIT: "false"

    scripts:
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Build Android Full Debug APK
        script: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --no-daemon --stacktrace

    artifacts:
      - androidApp/build/outputs/**/*.apk
